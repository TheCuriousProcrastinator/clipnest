name: Release validation

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate and build release package
        run: python3 scripts/build-release.py

      - name: Upload validated package
        uses: actions/upload-artifact@v4
        with:
          name: clipnest-${{ github.ref_name }}
          path: dist/clipnest-*.zip
          if-no-files-found: error
