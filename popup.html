<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ClipNest</title>
  <link rel="stylesheet" href="popup.css" />
  <link rel="stylesheet" href="themes.css" />
  <script src="themes.js"></script>
</head>
<body data-notion-startup="pending">
  <main class="app">
    <div class="topbar">
      <div>
        <h1>ClipNest</h1>
        <div id="siteLabel" class="muted ellipsis">Reading page…</div>
      </div>
      <button id="settingsButton" class="icon-button" type="button" title="Settings">⚙</button>
    </div>

    <section
      id="quickClipAccessGate"
      class="quick-clip-access-gate hidden"
      aria-labelledby="quickClipAccessTitle"
    >
      <div
        class="quick-clip-access-icon"
        aria-hidden="true"
      >
        C
      </div>

      <h2 id="quickClipAccessTitle">
        Enable Quick Clip
      </h2>

      <p>
        Quick Clip needs access to your Obsidian vault while ClipNest is closed.
      </p>

      <p class="quick-clip-access-hint">
        Continue in Settings, then choose <strong>Allow on every visit</strong> when Chrome asks.
      </p>

      <button
        id="quickClipAccessButton"
        class="primary"
        type="button"
      >
        Continue setup
      </button>

      <button
        id="quickClipAccessCancel"
        class="quick-clip-access-cancel"
        type="button"
      >
        Not now
      </button>

      <div
        id="quickClipAccessStatus"
        class="status"
        aria-live="polite"
      ></div>
    </section>

    <div class="destination" role="group" aria-label="Destination">
      <button class="destination-button" data-destination="obsidian" type="button">Obsidian</button>
      <button class="destination-button" data-destination="notion" type="button">Notion</button>
    </div>

    <label id="notionPresetField" class="field hidden">
      <span>Preset</span>
      <select id="notionPresetSelect">
        <option value="">No presets configured</option>
      </select>
    </label>

    <label class="field">
      <span>Title</span>
      <input id="titleInput" type="text" autocomplete="off" />
    </label>

    <div
      id="obsidianSaveTo"
      class="obsidian-save-to hidden"
    >
      <div class="obsidian-save-to-label">
        Save to
      </div>

      <button
        id="obsidianSaveToButton"
        class="obsidian-save-to-button"
        type="button"
        aria-expanded="false"
        aria-controls="obsidianSaveToDetails"
      >
        <span
          id="obsidianSaveToSummary"
          class="obsidian-save-to-summary"
        >
          Choose a vault
        </span>

        <span
          class="obsidian-save-to-chevron"
          aria-hidden="true"
        >
          ›
        </span>
      </button>

      <div
        id="obsidianSaveToDetails"
        class="obsidian-save-to-details hidden"
      >
        <label id="vaultField" class="field hidden">
          <span>Vault</span>
          <select id="vaultSelect">
            <option value="">No vault connected</option>
          </select>
        </label>

        <label id="folderField" class="field hidden">
          <span>Folder</span>
          <select id="folderSelect">
            <option value="">Vault root</option>
          </select>
        </label>

        <label id="templateField" class="field hidden">
          <span>Template</span>
          <select id="templateSelect">
            <option value="">None</option>
          </select>
          <small id="templateMeta">Detected from Obsidian</small>
        </label>

        <label
          id="obsidianOpenAfterSaveField"
          class="popup-toggle-row"
        >
          <span>Open after saving</span>

          <input
            id="obsidianOpenAfterSave"
            type="checkbox"
            aria-label="Open in Obsidian after saving"
          />
        </label>
      </div>
    </div>

    <label id="tagsField" class="field">
      <span>Tags</span>
      <input id="tagsInput" type="text" autocomplete="off" placeholder="reading, ai, research" />
    </label>

    <fieldset class="content-mode">
      <legend>Content</legend>

      <label class="mode-row">
        <input type="radio" name="contentMode" value="article" checked />
        <span>Article</span>
      </label>

      <label id="selectedTextModeRow" class="mode-row hidden">
        <input type="radio" name="contentMode" value="text" />
        <span>Selected text</span>
      </label>

      <label class="mode-row">
        <input type="radio" name="contentMode" value="selection" />
        <span>Select from page</span>
      </label>

      <button id="selectAreaButton" class="secondary hidden" type="button">
        Pick area on page
      </button>
    </fieldset>

    <div id="notesCompact" class="notes-compact">
      <button id="toggleNotes" class="notes-toggle" type="button">+ Add note</button>

      <label id="notesField" class="field hidden">
        <span>Note</span>
        <textarea id="notesInput" rows="3" placeholder="Optional note…"></textarea>
      </label>
    </div>

    <div class="actions">
      <button id="saveButton" class="primary" type="button" disabled>Save</button>
    </div>

    <div id="status" class="status" aria-live="polite"></div>
  </main>

  <script src="vault-store.js"></script>
  <script src="notion-store.js"></script>
  <script src="notion-session.js"></script>
  <script src="fs-store.js"></script>
  <script src="article-engine.js"></script>
  <script src="notion-image-picker.js"></script>
  <script src="notion-body-media.js"></script>
  <script src="popup.js"></script>
</body>
</html>
